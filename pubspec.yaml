name: apartment
description: "شطبها — منصة تشطيب وتصميم الوحدات السكنية بالذكاء الاصطناعي"
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  dio: ^5.9.2
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  dartz: ^0.10.1
  flutter_localizations:
    sdk: flutter
  fluentui_system_icons: ^1.1.273
  shimmer: ^3.0.0
  signature: ^6.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  gal: ^2.3.2
  share_plus: ^13.1.0
  intl: ^0.20.2
  flutter_widget_from_html: ^0.17.2
  arabic_reshaper: ^0.0.1
  url_launcher: ^6.3.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon_optimized.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground_optimized.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - shorebird.yaml
    - assets/font/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/Cairo-Medium.ttf
          weight: 500
        - asset: assets/font/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/Cairo-Bold.ttf
          weight: 700
