name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch: # This allows you to run the build manually from GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Create Payload directory
        run: mkdir -p Payload

      - name: Move app to Payload
        run: mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip to IPA
        run: zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: shatbha-app-ios
          path: app.ipa
          retention-days: 30
